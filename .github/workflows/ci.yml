name: CI

# Validates content and both apps on pull requests and pushes to the default
# branch. Keeps the catalog parity-correct and both build targets green.
on:
  pull_request:
  push:
    branches: [claude/temple-app-phase-1-jfbtxy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency validator: schema + cross-locale parity.
      - run: node packages/content/scripts/validate.mjs
      # Translation QA: fails only on untranslated fields (advisory warnings ok).
      - run: node packages/content/scripts/qa-translations.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 runs the TypeScript test suite directly via native type
      # stripping — no test-runner dependency, no install step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "packages/**/test/*.test.ts" "apps/**/test/*.test.ts"

  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @temple/web...
      - run: pnpm build:web
      # Fail the build if the static export blows the performance budget.
      - run: node apps/web/scripts/check-budget.mjs

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @temple/web...
      - run: pnpm build:web
      # Serves the export with the real firebase.json headers (see
      # scripts/serve-out.mjs) and runs Lighthouse. Gates accessibility, SEO,
      # best-practices, and CLS; performance is a non-blocking warning (score
      # varies with runner load). ubuntu-latest ships Chrome for chrome-launcher.
      - run: pnpm --filter @temple/web exec lhci autorun

  mobile:
    name: Typecheck mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @temple/mobile...
      # generated.ts is git-ignored; produce it before typechecking.
      - run: pnpm --filter @temple/content generate
      - run: pnpm --filter @temple/mobile typecheck
